name: Build & Upload artifact

on:
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version to use for the build'
        type: string
        required: false
        default: '22.11.0'
      working-dir:
        description: 'Directory where the Astro project is located'
        type: string
        required: false
        default: './website'
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use for the build'
        type: string
        required: false
        default: '22.11.0'
      working-dir:
        description: 'Directory where the Astro project is located'
        type: string
        required: false
        default: './website'
      build-command:
        description: 'Command to run for building the Astro project'
        type: string
        required: false
        default: 'npm run build'
      artifact-name:
        description: 'Name of the artifact to be uploaded'
        type: string
        required: false
      GH_PAGES:
        description: 'Set to true if building for GitHub Pages'
        type: boolean
        required: false
        default: false
    outputs:
      artifact-id:
        description: "ID of the uploaded artifact"
        value: ${{ jobs.build.outputs.artifact-id }}
      artifact-url:
        description: "URL of the uploaded artifact"
        value: ${{ jobs.build.outputs.artifact-url }}
      artifact-digest:
        description: "SHA256 digest of the uploaded artifact"
        value: ${{ jobs.build.outputs.artifact-digest }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: deploy
    defaults:
      run:
        working-directory: ${{ inputs.working-dir }}
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}

    steps:
    - uses: actions/checkout@v4 # Checkout the repository to the runner
    # - uses: actions/cache@v4
    #   with:
    #     path: ~/.npm
    #     key: ${{ runner.os }}-node-${{ hashFiles('${{ inputs.working-dir }}/package-lock.json') }}
    #     restore-keys: |
    #       ${{ runner.os }}-node-

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ inputs.working-dir }}/package-lock.json

    - name: Install dependencies with NPM
      run: npm ci

    - name: Build with Astro
      run: ${{ inputs.build-command }}
      env:
        PUBLIC_IS_GH_PAGES: ${{ inputs.GH_PAGES }}

    - name: Upload artifact
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name || vars.ARTIFACT_NAME }}
        path: ./website/dist
        retention-days: 90